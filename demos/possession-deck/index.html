<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Possession Deck · Pitch Lab</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  body.floodlit { background-color: #0b1022; background-image: radial-gradient(ellipse at 50% -10%, rgba(255,255,220,.16), transparent 55%), radial-gradient(circle at 0 0, rgba(255,255,230,.10), transparent 30%), radial-gradient(circle at 100% 0, rgba(255,255,230,.10), transparent 30%); }
  body.dusk { background-image: radial-gradient(circle at 50% 0%, rgba(255,140,60,.16), transparent 50%); }
  .pd { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  .field { position: relative; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #2E3A59; }
  .field canvas { width: 100%; }
  .plate { position: absolute; right: 6px; width: 46%; max-width: 210px; transition: top .45s cubic-bezier(.3,1.3,.5,1); z-index: 3;
    background: rgba(255,246,224,.96); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); padding: 12px 6px 5px; }
  .plate .zname { font-family: var(--font-h); font-size: 14px; line-height: 1; display: flex; justify-content: space-between; gap: 4px; align-items: baseline; }
  .plate .zname span { font-family: var(--font); font-size: 10px; opacity: .6; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .intent { position: absolute; top: -18px; left: -8px; display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-h); font-size: 16px; color: #fff;
    background: var(--red); border: 2.5px solid var(--ink); border-radius: 99px; padding: 1px 8px 1px 6px; box-shadow: 0 2px 0 var(--ink); white-space: nowrap; animation: bob 1.2s ease-in-out infinite; }
  .intent small { font-family: var(--font); font-size: 10px; font-weight: 900; opacity: .9; }
  .intent.compact { background: #3b8fd6; } .intent.foul { background: var(--sun); color: var(--ink); } .intent.rattled { background: #8a8fa8; } .intent.counter { background: #7a1410; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  .hp { position: relative; height: 16px; margin-top: 4px; background: #3a2a2a; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .hp i { position: absolute; top: 0; bottom: 0; left: 0; transition: width .3s; }
  .hp .fill { background: linear-gradient(#ff7b6b, #d2412f); }
  .hp .ghost { background: repeating-linear-gradient(45deg, #ffe07a 0 5px, #ffb300 5px 10px); transition: none; }
  .hp b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-h); font-weight: 400; font-size: 12px; color: #fff; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .hpline { display: flex; align-items: center; gap: 4px; }
  .hpline .hp { flex: 1; }
  .blk { font-family: var(--font-h); font-size: 13px; background: #3b8fd6; color: #fff; border: 2px solid var(--ink); border-radius: 7px; padding: 0 5px; margin-top: 4px; }
  .ztags { font-size: 10px; font-weight: 900; margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
  .ztags span { background: #ffe07a; border: 1.5px solid var(--ink); border-radius: 5px; padding: 0 4px; }
  .ztags .pv { background: #ffd23f; }
  .ztags .brk { background: #2e9e4f; color: #fff; }
  .plate.hit { animation: plateHit .35s; }
  @keyframes plateHit { 15% { transform: translate(-6px, 2px) rotate(-2deg); background: #ffd0c8; } 35% { transform: translate(5px, -2px) rotate(1.5deg); } 60% { transform: translate(-3px, 1px); } }
  .relics { position: absolute; left: 6px; bottom: 6px; display: flex; gap: 4px; z-index: 3; }
  .relic { width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); display: grid; place-items: center; font-size: 15px; box-shadow: 0 2px 0 var(--ink); cursor: help; }

  .status { display: flex; align-items: center; gap: 8px; }
  .energy { flex: none; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3a8, var(--sun) 45%, var(--sun-d)); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
    display: grid; place-items: center; font-family: var(--font-h); color: var(--ink); font-size: 22px; line-height: 1; }
  .energy small { font-size: 12px; opacity: .6; }
  .energy.empty { filter: grayscale(.9) brightness(.7); }
  .comp { flex: 1; min-width: 0; }
  .comp .lbl { display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .6px; opacity: .85; }
  .bar { position: relative; height: 18px; background: #2a2f4a; border: 2.5px solid var(--ink); border-radius: 8px; overflow: hidden; margin-top: 2px; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(#7ee08a, #2e9e4f); transition: width .35s; }
  .bar i.loss { background: repeating-linear-gradient(45deg, #ff8a7a 0 5px, #d2412f 5px 10px); transition: none; }
  .bar.low i:not(.loss) { background: linear-gradient(#ffb86b, #e07a1f); }
  .bar b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-h); font-weight: 400; font-size: 12px; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
  .comp.hurt { animation: shake .35s; }
  .pill { flex: none; font-family: var(--font-h); font-size: 16px; border: 2.5px solid var(--ink); border-radius: 10px; padding: 3px 8px; box-shadow: 0 2px 0 var(--ink); background: #3b8fd6; color: #fff; text-align: center; line-height: 1; }
  .pill small { display: block; font-family: var(--font); font-size: 9px; font-weight: 900; text-transform: uppercase; opacity: .85; }
  .pill.rhy { background: var(--purple); }
  .pill .pv { color: #ffe07a; }

  .handwrap { position: relative; height: 178px; overflow-x: clip; }
  .hand { position: absolute; inset: 26px 0 0 0; }
  .hand .gcard { position: absolute; top: 0; transform-origin: 50% 120%; transition: transform .16s, left .2s, box-shadow .12s; }
  .hand .gcard.sel { box-shadow: 0 0 0 3px var(--sun), 0 8px 0 var(--ink); }
  .hand .gcard.disabled .cost { background: #888; }
  .hand .gcard.dealt { animation: deal .3s backwards; }
  @keyframes deal { from { opacity: 0; translate: 0 90px; } }
  .gcard .art.sprite { background-size: contain; background-position: center 85%; background-color: #8fd27f; }
  .gcard .text b.up { color: #1f8a3a; } .gcard .text b.dn { color: #c0392b; }
  .gcard .text small { display: block; font-size: 9px; opacity: .65; }
  .gcard .kh { position: absolute; right: 4px; bottom: 3px; font-size: 9px; opacity: .45; font-weight: 900; }
  .gcard .dv { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); z-index: 3; font-family: var(--font-h); font-size: 15px; background: #3b8fd6; color: #fff; border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; white-space: nowrap; }
  .gcard.exh .type::after { content: ' · once'; }
  .flying { pointer-events: none; }
  .hint { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .8; min-height: 18px; }
  .hint b { color: var(--sun); }

  .actions { display: flex; gap: 6px; align-items: center; }
  .actions .btn { min-height: 44px; }
  .actions .piles { font-size: 12px; min-width: 52px; opacity: .75; line-height: 1.2; flex: 1; cursor: pointer; text-decoration: underline dotted; }
  .actions .btn.small { padding: 5px 9px; }

  .picks { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
  .picks .gcard { position: relative; }
  .node { width: 118px; min-height: 120px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; box-shadow: 0 4px 0 var(--ink); cursor: pointer; padding: 8px; text-align: center; color: var(--ink); }
  .node:hover { transform: translateY(-4px); }
  .node .ic { font-size: 34px; }
  .node h4 { font-size: 16px; }
  .node p { font-size: 11px; margin: 4px 0 0; }
  .runmap { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 900; margin: 4px 0; flex-wrap: wrap; }
  .runmap span { background: var(--paper2); border: 2px solid var(--ink); border-radius: 99px; padding: 1px 7px; }
  .runmap span.on { background: var(--sun); }
  .deckgrid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .deckgrid .gcard { transform: scale(.82); margin: -12px -9px; }
  @media (max-width: 380px) { .plate { width: 50%; } }
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
