<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111830">
<title>Touchline · Pitch Lab</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  .screen { display: flex; flex-direction: column; gap: 10px; }
  .logo { font-family: var(--font-h); font-size: 46px; color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 5px 0 var(--ink); text-align: center; line-height: 1; margin-top: 4px; }
  .sublogo { text-align: center; font-size: 13px; opacity: .8; margin-top: -2px; }
  h2.sec { font-size: 20px; margin: 6px 2px 0; }

  /* coach + league pickers */
  .coaches { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .coach { flex: none; width: 104px; text-align: center; cursor: pointer; padding: 6px; }
  .coach img { width: 84px; height: 84px; border-radius: 10px; border: 3px solid var(--ink); display: block; margin: 0 auto 4px; }
  .coach b { font-family: var(--font-h); font-weight: 400; font-size: 14px; display: block; line-height: 1.1; }
  .coach span { font-size: 10.5px; opacity: .7; }
  .coach.sel { outline: 4px solid var(--sun); transform: translateY(-3px); }
  .coach.locked img { filter: brightness(0) opacity(.45); }
  .coach.locked { opacity: .75; }
  .coachinfo { font-size: 13px; }
  .league { display: flex; gap: 10px; align-items: center; cursor: pointer; transition: transform .1s; }
  .league:hover { transform: translateY(-2px); }
  .league .flag { font-size: 30px; }
  .league h3 { font-size: 19px; }
  .league p { margin: 2px 0 0; font-size: 12.5px; }
  .league .boss img { width: 54px; height: 54px; border-radius: 10px; border: 3px solid var(--ink); }
  .league.done { background: linear-gradient(120deg, var(--paper) 60%, #c8f5c0); }
  .league.locked { opacity: .55; pointer-events: none; }
  .stylechip { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 2px solid var(--ink); font-family: var(--font-h); color: var(--ink); }

  /* ladder */
  .ladder { display: flex; flex-direction: column-reverse; gap: 8px; }
  .rung { display: flex; align-items: center; gap: 10px; padding: 10px; }
  .rung .num { font-family: var(--font-h); font-size: 13px; opacity: .6; width: 82px; }
  .rung.cur { outline: 4px solid var(--sun); }
  .rung.past { opacity: .55; }
  .rung .kit { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--ink); }

  /* match */
  .match { gap: 8px; }
  .pitchwrap { position: relative; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #2E3A59; }
  .spellbadge { position: absolute; left: 6px; top: 4px; font-family: var(--font-h); font-size: 11px; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 8px; color: #fff; pointer-events: none; }
  .ticker { height: 28px; line-height: 28px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.12); border-radius: 9px; padding: 0 10px; }
  .ticker b { font-family: var(--font-h); font-weight: 400; color: var(--sun); margin-right: 4px; }
  .ticker.good { color: #9ff0a8; } .ticker.bad, .ticker.them { color: #ffb4a8; } .ticker.goal { color: var(--sun); }
  .ticker .why, .comm .why { font-style: normal; opacity: .85; white-space: nowrap; }
  .mpanel { padding: 10px; display: flex; flex-direction: column; gap: 8px; }

  .rival { display: flex; gap: 6px; align-items: center; height: 30px; }
  .rival img, .rival .crest { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--ink); flex: none; background: #2a3560; display: grid; place-items: center; }
  .rival .lbl { font-size: 11px; opacity: .75; flex: none; }
  .rival .chips { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .rival .chips::-webkit-scrollbar { display: none; }
  .rival .ichip { flex: none; }
  .ichip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px 2px 3px; border-radius: 8px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 12px; font-weight: 900; cursor: pointer; }
  .ichip i { font-style: normal; width: 19px; height: 19px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; }

  .duels { display: flex; flex-direction: column; gap: 2px; }
  .dhead, .drow { display: grid; grid-template-columns: 86px 1fr 1fr; gap: 6px; align-items: center; }
  .drow { height: 28px; }
  .dhead { height: 26px; }
  .dhead > span:not(.dname) { font-family: var(--font-h); font-size: 12px; text-align: center; white-space: nowrap; }
  .dhead em { font-style: normal; }
  .dhead .odds { font-size: 12px; padding: 0 6px; }
  .dhead .dname { font-size: 11px; opacity: .85; }
  .dname { font-size: 12px; line-height: 1.05; font-weight: 900; }
  .dname small { display: block; font-size: 11px; opacity: .6; font-weight: 700; }
  .dcell { border-radius: 8px; padding: 2px; }
  .dbar { position: relative; height: 20px; border: 2px solid var(--ink); border-radius: 7px; overflow: hidden; background: #3a4370; }
  .dbar i { position: absolute; inset: 0 auto 0 0; background: var(--sun); transition: width .3s; }
  .dbar.opp i { background: #ff6b6b; }
  .dbar b { position: relative; display: block; text-align: center; font-family: var(--font-h); font-weight: 400; font-size: 13px; line-height: 16px; color: #fff; -webkit-text-stroke: 2.5px var(--ink); paint-order: stroke fill; }
  .dbar b em { font-style: normal; font-size: 11px; margin-left: 3px; }
  .dbar b em.up { color: #8ef58e; } .dbar b em.down { color: #ffb4a8; }
  .dcell.changed .dbar { box-shadow: 0 0 0 2px var(--sun); }
  .dcell.focus { background: rgba(255,210,63,.22); box-shadow: 0 0 0 2px var(--sun); }
  .proj { display: flex; flex-wrap: nowrap; gap: 5px; align-items: center; justify-content: center; font-size: 13px; text-align: center; white-space: nowrap; height: 24px; }
  .proj .odds { font-size: 13px; padding: 1px 7px; }
  .proj .sub { font-size: 11px; opacity: .7; }
  .tired { color: #ffb4a8; }
  .infoline { height: 34px; overflow: hidden; font-size: 12px; line-height: 1.35; background: rgba(0,0,0,.25); border-radius: 8px; padding: 2px 8px; display: flex; align-items: center; }
  .infoline > .it { flex: 1; min-width: 0; }
  .infoline .played { width: 100%; }
  .plcount { display: inline-block; background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 0 4px; font-size: 11px; margin-right: 2px; letter-spacing: 1px; }
  .tapagain { color: var(--sun); font-weight: 900; margin-left: 4px; white-space: nowrap; }

  .played { display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; height: 26px; align-items: center; font-size: 12px; scrollbar-width: none; }
  .played::-webkit-scrollbar { display: none; }
  .pchip { flex: none; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; min-height: 24px; padding: 2px 8px; border-radius: 9px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 12px; font-weight: 900; }
  .pchip i { font-style: normal; opacity: .5; }

  .hand { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding-top: 9px; height: 113px; }
  .hand.many { display: flex; overflow-x: auto; scrollbar-width: none; padding-left: 1px; }
  .hand.many::-webkit-scrollbar { display: none; }
  .hand.many .mcard { flex: none; width: calc((100% - 24px) / 5.3); }
  .mcard { --cc: var(--sun); position: relative; min-width: 0; height: 100px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink); display: flex; flex-direction: column; align-items: center; padding: 3px 2px 3px; cursor: pointer; user-select: none; transition: transform .12s, box-shadow .12s; overflow: hidden; }
  .mcard::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 17px; background: var(--cc); border-bottom: 2px solid var(--ink); }
  .mcard .cost { position: absolute; top: -2px; left: -2px; width: 21px; height: 21px; z-index: 2; background: var(--sky); border: 2px solid var(--ink); border-radius: 50%; font-family: var(--font-h); font-size: 13px; display: grid; place-items: center; }
  .mcard .ic { position: relative; z-index: 1; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink); background: #cfe9c4 center/cover no-repeat; display: grid; place-items: center; font-size: 17px; flex: none; }
  .mcard .nm { font-family: var(--font-h); font-size: 11px; letter-spacing: -.2px; line-height: 1.05;  text-align: center; margin-top: 3px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .mcard .fx { font-size: 11px; font-weight: 900; line-height: 1.1; text-align: center; color: #23408a; margin-top: auto; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .mcard .nm.long { letter-spacing: -.6px; }
  .mcard.sel { transform: translateY(-9px); box-shadow: 0 0 0 3px var(--sun), 0 6px 0 var(--ink); }
  .mcard.cant { filter: grayscale(.7) brightness(.8); }
  .mcard:active { transform: translateY(2px); }
  .flycard { position: fixed; z-index: 70; pointer-events: none; background: var(--paper); border: 2.5px solid var(--ink); border-top: 14px solid var(--cc); border-radius: 10px; display: grid; place-items: center; font-size: 22px; }

  .planbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .planbar #kick { font-size: 19px; padding: 9px 16px; min-height: 46px; }
  .shouts { display: flex; gap: 4px; align-items: center; font-family: var(--font-h); font-size: 13px; }
  .gem { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--sky); box-shadow: inset -3px -3px 0 rgba(0,0,0,.2); }
  .gem.off { background: #39415e; box-shadow: none; }
  .deckinfo { font-size: 11px; opacity: .7; cursor: pointer; text-decoration: underline dotted; margin-top: 4px; }

  .comm { list-style: none; margin: 0; padding: 0; font-size: 12.5px; line-height: 1.3; min-height: 3.9em; }
  .comm li { display: flex; gap: 6px; padding: 2px 0; }
  .comm li:first-child { font-weight: 900; }
  .comm li .t { font-family: var(--font-h); opacity: .55; min-width: 24px; flex: none; }
  .comm li.good { color: #9ff0a8; } .comm li.bad, .comm li.them { color: #ffb4a8; } .comm li.goal { color: var(--sun); } .comm li.info { color: #c8cde6; }
  .liverow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; }
  .speed { display: flex; gap: 5px; }
  .speed .btn { min-width: 44px; min-height: 40px; }

  .moment h3 { font-size: 22px; color: var(--sun); }
  .moment.def h3 { color: #ff8a80; }
  .moment .msub { font-size: 13px; }
  .moment .opt { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; justify-content: space-between; text-align: left; white-space: normal; font-size: 16px; min-height: 48px; }
  .moment .opt small { display: block; font-family: var(--font); font-size: 11.5px; opacity: .75; }
  .moment .opt > span:first-child { min-width: 0; }
  .moment .opt .odds { flex: none; white-space: nowrap; }
  .ftpanel { text-align: center; padding: 20px 0; }
  .ftpanel h3 { font-size: 28px; color: var(--sun); }

  .rewards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; padding: 10px 0; }
  .rewards .gcard { width: 120px; height: 168px; }
  .boons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .deckgrid { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .deckgrid .gcard { width: 100px; height: auto; min-height: 146px; cursor: default; }
  .deckgrid .gcard .art { flex: none; }
  .deckgrid .gcard::before, .rewards .gcard::before { height: 30px; }
  .deckgrid .gcard .name, .rewards .gcard .name { height: 30px; font-size: 11px !important; line-height: 1.05; padding: 2px 4px 0 24px; overflow-wrap: anywhere; }
  .deckgrid .chip { top: auto !important; bottom: -6px; }
  .deckgrid .gcard:hover { transform: none; }
  .trophy { font-size: 80px; text-align: center; animation: popin .5s; }
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
