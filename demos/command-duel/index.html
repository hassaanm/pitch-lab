<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Duel · Pitch Lab</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  .cd { display: flex; flex-direction: column; gap: 8px; max-width: 620px; margin: 0 auto; }
  .cd-track { display: flex; align-items: center; gap: 2px; }
  .cd-track .zp {
    flex: 1; text-align: center; font-family: var(--font-h); font-size: 12px; padding: 5px 0; border-radius: 9px;
    background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.14); color: rgba(255,255,255,.65); position: relative; white-space: nowrap;
  }
  .cd-track .zp.on { color: var(--ink); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); transform: translateY(-1px); }
  .cd-track .zp.on.us { background: var(--sun); }
  .cd-track .zp.on.them { background: var(--red); color: #fff; }
  .cd-track .bl { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: 12px; animation: bob 0.6s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translate(-50%, -3px); } }
  .cd-track .arrow { color: rgba(255,255,255,.3); font-size: 12px; }
  .cd-bar { display: flex; gap: 8px; align-items: center; }
  .guts { flex: 1; display: flex; align-items: center; gap: 6px; }
  .guts .h { font-family: var(--font-h); font-size: 13px; color: var(--sun); letter-spacing: 1px; }
  .gbar { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 8px; background: #0b0f1d; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .gbar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8a3d, #ffd23f); transition: width .35s; }
  .guts.full .gbar i { background: linear-gradient(90deg, #ffd23f, #fff59d, #ffd23f); background-size: 200% 100%; animation: shine 1.2s linear infinite; }
  @keyframes shine { to { background-position: -200% 0; } }
  .gval { font-family: var(--font-h); font-size: 14px; min-width: 24px; }
  .tbtn {
    font-family: var(--font-h); font-size: 14px; display: inline-flex; gap: 5px; align-items: center; min-height: 40px;
    background: #6fd36a; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 10px; box-shadow: 0 3px 0 var(--ink); cursor: pointer;
  }
  .tbtn.off { background: #8a8fa8; }
  .tbtn .kbd { font-size: 10px; }

  .duel { position: relative; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); background: #1b2a1b; }
  .duel canvas { width: 100%; height: auto; display: block; }
  .vs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 5px; align-items: center; height: 48px; }
  .vsx { font-family: var(--font-h); font-weight: 400; font-size: 13px; opacity: .55; }
  .hud {
    display: flex; gap: 5px; align-items: center; padding: 3px 6px 3px 3px; min-width: 0; height: 46px; box-sizing: border-box;
    background: rgba(255,246,224,.96); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
  }
  .hud:empty { visibility: hidden; }
  .hud.them { flex-direction: row-reverse; text-align: right; padding: 3px 3px 3px 6px; }
  .hud img { width: 34px; height: 34px; border-radius: 8px; border: 2px solid var(--ink); background: #ffe680; flex: none; }
  .hud.red img { background: #ffb3ab; }
  .hud .hi { min-width: 0; flex: 1; }
  .hud b { font-family: var(--font-h); font-weight: 400; font-size: 14px; display: block; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud small { font-size: 9.5px; font-weight: 900; opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .hud .sbar { height: 6px; width: 100%; border: 1.5px solid var(--ink); border-radius: 4px; background: #e8dcbc; overflow: hidden; margin-top: 2px; box-sizing: border-box; }
  .hud.them .sbar i { margin-left: auto; }
  .hud .sbar i { display: block; height: 100%; background: var(--good); transition: width .3s; }
  .hud .sbar.low i { background: var(--bad); }

  @keyframes tellIn { from { transform: scale(.4); opacity: 0; } }
  .cmdpanel { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .scout { display: flex; gap: 6px; font-size: 12.5px; line-height: 1.2; align-items: flex-start; min-height: 31px; }
  .scout .nb { font-size: 16px; }
  .scout .act { font-family: var(--font-h); font-weight: 400; font-size: 11px; background: var(--red); color: #fff; border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 4px; white-space: nowrap; }
  .read { display: flex; gap: 6px; align-items: center; height: 22px; }
  .read .rl { font-family: var(--font-h); font-size: 12px; opacity: .6; }
  .rbar { flex: 1; display: flex; height: 20px; border: 2px solid var(--ink); border-radius: 7px; overflow: hidden; }
  .rbar i { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; transition: flex .3s; border-right: 1.5px solid var(--ink); }
  .rbar i:last-child { border-right: 0; }
  .rbar em { font-style: normal; font-size: 10.5px; color: #fff; font-weight: 900; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .cmds { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-auto-rows: 50px; gap: 7px 7px; height: 172px; align-content: start; padding-top: 6px; box-sizing: border-box; }
  .cmd { min-width: 0; justify-content: flex-start; gap: 6px; padding: 4px 7px; height: 50px; min-height: 0; font-size: 15.5px; text-align: left; white-space: normal; position: relative; box-sizing: border-box; }
  .cmd.wide { grid-column: 1 / -1; }
  .cmd .key { flex: none; }
  .cmd .lbl { overflow: hidden; }
  .cmd .lbl { flex: 1; min-width: 0; line-height: 1.05; }
  .cmd .lbl > span.t { display: block; white-space: nowrap; }
  .cmd .lbl small { display: block; font-family: var(--font); font-size: 10px; line-height: 1.12; font-weight: 800; opacity: .8; margin-top: 1px; white-space: normal; overflow-wrap: anywhere; }
  .cmd .odds { font-size: 13px; padding: 1px 6px; flex: none; }
  .cmd img { width: 32px; height: 32px; border-radius: 7px; border: 2px solid var(--ink); background: #ffe680; flex: none; }
  .cmd .cost { position: absolute; top: -9px; right: 6px; font-family: var(--font-h); font-size: 11px; background: var(--sun); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 0 4px; }
  .btn.gold { background: linear-gradient(135deg, #ffe680, #ffb300); }
  .cmd.ghost { height: 44px; color: var(--ink); background: var(--paper2); border-color: var(--ink); }
  .cmds .wait { grid-column: 1 / -1; grid-row: 1 / 4; display: grid; place-items: center; font-family: var(--font-h); font-size: 17px; opacity: .55; text-align: center; }
  .cmd .gain { position: absolute; top: -9px; right: 6px; font-family: var(--font-h); font-size: 11px; background: #9ef0a8; color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; padding: 0 4px; }
  .cmd.picked { filter: brightness(1.12); transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .rules { font-size: 10.5px; text-align: center; opacity: .55; font-weight: 900; min-height: 14px; }

  /* timing checks */
  .tc-wrap { position: fixed; inset: 0; z-index: 75; display: grid; place-items: end center; padding: 0 12px max(4vh, 16px); background: linear-gradient(rgba(8,10,25,0) 40%, rgba(8,10,25,.55)); touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
  .tc { width: min(360px, 100%); text-align: center; position: relative; animation: tellIn .2s; }
  .tc-title { font-family: var(--font-h); font-size: 22px; color: var(--sun); margin-bottom: 8px; }
  .tc-hint { font-size: 11px; opacity: .6; margin-top: 8px; }
  .tc-track { position: relative; height: 34px; border: 3px solid var(--ink); border-radius: 10px; background: #3a2230; overflow: hidden; }
  .tc-green { position: absolute; top: 0; bottom: 0; background: #2e9e4f; }
  .tc-perf { position: absolute; top: 0; bottom: 0; background: #b9ff8a; }
  .tc-mark { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; border: 2px solid var(--ink); border-radius: 3px; }
  .tc-arrows { display: flex; justify-content: center; gap: 10px; }
  .tc-arrows span { width: 54px; height: 54px; display: grid; place-items: center; font-size: 28px; border-radius: 12px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); opacity: .55; }
  .tc-arrows span.cur { opacity: 1; background: var(--sun); transform: scale(1.12); }
  .tc-arrows span.ok { opacity: 1; background: #6fd36a; }
  .tc-arrows span.bad { opacity: 1; background: var(--red); color: #fff; }
  .tc-timer { height: 10px; border: 2px solid var(--ink); border-radius: 6px; margin-top: 10px; background: #0b0f1d; overflow: hidden; }
  .tc-timer i { display: block; height: 100%; background: var(--sun); }
  .tc-dirs { position: absolute; inset: 0; pointer-events: none; }
  .tc-dirs b { position: fixed; font-size: 30px; color: rgba(255,255,255,.22); pointer-events: none; }
  .tc-dirs .u { top: 30vh; left: 50%; transform: translateX(-50%); } .tc-dirs .d { bottom: 6vh; left: 50%; transform: translateX(-50%); }
  .tc-dirs .l { left: 4vw; top: 50%; } .tc-dirs .r { right: 4vw; top: 50%; }
  .tc-ringbox { position: relative; height: 200px; display: grid; place-items: center; }
  .tc-target { position: absolute; border-radius: 50%; border: 4px dashed #9ef0a8; }
  .tc-ring { position: absolute; border-radius: 50%; border: 6px solid var(--sun); box-shadow: 0 0 0 3px var(--ink); }
  .tc-glove { font-size: 30px; }
  .tc-result { position: absolute; left: 50%; top: -34px; transform: translateX(-50%) rotate(-4deg); font-family: var(--font-h); font-size: 34px; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; animation: tellIn .25s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; }
  .tc-result.perfect { color: #b9ff8a; } .tc-result.good { color: var(--sun); } .tc-result.miss { color: #ff8a80; }

  @media (max-width: 480px) {
    .cmd .key { display: none; }
    .cmd { gap: 5px; padding: 4px 6px; }
    .cmd .odds { font-size: 12px; padding: 1px 4px; }
  }
  @media (max-width: 400px) {
    .cd-track .zp { font-size: 11px; }
    .cmd { font-size: 14.5px; }
    .hud b { font-size: 13px; }
    .hud small { font-size: 9px; }
  }
</style>
</head>
<body>
<script type="module" src="game.js"></script>
</body>
</html>
