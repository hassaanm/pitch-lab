<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Tactics · Pitch Lab</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  .gt { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .gt-status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .gt-status .turn { font-family: var(--font-h); font-size: 17px; margin-right: auto; }
  .gt-status .turn.red { color: #ff8a7a; }
  .gt-canvas { position: relative; align-self: center; border-radius: 12px; overflow: hidden; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .gt-info { font-size: 12.5px; height: 68px; overflow: hidden; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.06); border-radius: 10px; padding: 4px 8px; line-height: 1.25; }
  .gt-info img { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--ink); flex: none; }
  .gt-info .st { opacity: .75; font-size: 11px; }
  .gt-info .tx { flex: 1; min-width: 0; }
  .gt-info .last, .gt-info .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gt-info .last { font-size: 11px; color: var(--muted); }
  .gt-info .tip { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }

  .gt-status .turn.pulse { animation: turnPulse .6s; }
  @keyframes turnPulse { 0% { transform: scale(1); } 30% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .gt-status .turn { display: inline-block; transform-origin: left center; }
  .gt-info .sp { margin-left: auto; flex: none; }
  .gt-bar { position: sticky; bottom: 0; z-index: 20; display: flex; gap: 5px; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            background: linear-gradient(rgba(23,32,59,0), var(--bg) 30%); }
  .gt-bar .btn { min-height: 44px; flex: 1 1 0; min-width: 0; white-space: nowrap; padding: 4px 5px; font-size: 14px; gap: 4px; }
  .gt-bar .left { font-size: 11px; padding: 0 6px; min-width: 18px; text-align: center; }
  .gt-bar .btn.icon { flex: .5; font-size: 20px; }
  .gt-bar .btn.end { flex: 1.3; }
  .gt-bar .btn[hidden] { display: none; }
  .gt-bar .odds { font-size: 11px; padding: 0 5px; }
  .keys { font-size: 11px; color: var(--muted); text-align: center; }
  @media (pointer: coarse) { .keys { display: none; } .btn .key { display: none; } }
  .spbtn { font-family: var(--font-h); font-size: 12px; border: 2px solid var(--ink); border-radius: 99px; padding: 3px 8px; background: #ce93d8; color: var(--ink); cursor: pointer; min-height: 30px; }
  .spbtn.on { background: var(--sun); box-shadow: 0 0 0 2px var(--sun); }
</style>
</head>
<body>
<script type="module" src="./game.js"></script>
</body>
</html>
