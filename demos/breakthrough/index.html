<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakthrough Puzzles · Pitch Lab</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  .bt { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .bt-chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .bt-chips::-webkit-scrollbar { display: none; }
  .pz { flex: none; min-width: 42px; height: 42px; border-radius: 10px; cursor: pointer; padding: 0 6px;
        background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.2); color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .pz b { font-family: var(--font-h); font-weight: 400; font-size: 15px; }
  .pz i { font-style: normal; font-size: 9px; letter-spacing: -1px; color: var(--sun); height: 10px; }
  .pz.on { background: var(--sun); color: var(--ink); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .pz.on i { color: var(--ink); }
  .bt-title { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; }
  .bt-title h3 { font-size: 20px; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bt-title .chip { flex: none; }
  /* fixed heights: showing the hint or a long tip never pushes the pitch or the bar */
  .bt-hint { font-size: 12.5px; line-height: 17px; color: #cfd3e6; height: 34px; overflow: hidden; }
  .bt-hint button { background: none; border: 1.5px dashed rgba(255,255,255,.35); border-radius: 8px; color: #fff; font-size: 12px; padding: 2px 8px; cursor: pointer; }
  .bt-canvas { position: relative; align-self: center; border-radius: 12px; overflow: hidden; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .bt-info { font-size: 12.5px; line-height: 1.25; height: 50px; overflow: hidden; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.06); border-radius: 10px; padding: 4px 8px; }
  .bt-info img { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--ink); flex: none; }
  .bt-bar { position: sticky; bottom: 0; z-index: 20; display: flex; gap: 6px; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            background: linear-gradient(rgba(23,32,59,0), var(--bg) 30%); }
  .bt-bar .btn { min-height: 44px; flex: 1; padding: 6px 8px; font-size: 15px; }
  .bt-bar .btn.end { flex: 1.5; }
  /* label over the odds pill, so the bar fits 375 px without overflowing */
  .bt-bar .btn { min-width: 0; }
  .bt-bar .btn[data-a=shoot], .bt-bar .btn.end { flex-direction: column; gap: 1px; line-height: 1.05; padding: 3px 4px; }
  .bt-bar .btn.icon { flex: none; width: 44px; padding: 6px 0; font-size: 20px; }
  .bt-bar .odds { font-size: 10.5px; padding: 0 5px; line-height: 1.25; }
  .keys { font-size: 11px; color: var(--muted); text-align: center; }
  @media (pointer: coarse) { .keys { display: none; } .btn .key { display: none; } }
  .stars { font-size: 34px; color: var(--sun); -webkit-text-stroke: 1.5px var(--ink); letter-spacing: 4px; text-align: center; }
  .stars .off { color: #d8ccaa; }
</style>
</head>
<body>
<script type="module" src="./game.js"></script>
</body>
</html>
